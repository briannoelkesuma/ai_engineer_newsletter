name: Process Telegram Commands

on:
  repository_dispatch:
    types: [telegram_command]

permissions:
  contents: write

jobs:
  process-commands:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Poller
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SUMMARY_THREAD_ID: ${{ secrets.TELEGRAM_SUMMARY_THREAD_ID }}
          TELEGRAM_DIGEST_THREAD_ID: ${{ secrets.TELEGRAM_DIGEST_THREAD_ID }}
        run: python telegram_bot.py poll
