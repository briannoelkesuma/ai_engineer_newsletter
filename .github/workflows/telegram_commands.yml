name: Process Telegram Commands

on:
  repository_dispatch:
    types: [telegram_command]

permissions:
  contents: write

jobs:
  process-commands:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Command
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SUMMARY_THREAD_ID: ${{ secrets.TELEGRAM_SUMMARY_THREAD_ID }}
          TELEGRAM_DIGEST_THREAD_ID: ${{ secrets.TELEGRAM_DIGEST_THREAD_ID }}
          TG_COMMAND: ${{ github.event.client_payload.command }}
          TG_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          TG_THREAD_ID: ${{ github.event.client_payload.thread_id }}
        run: python telegram_bot.py handle "$TG_COMMAND" "$TG_CHAT_ID" "$TG_THREAD_ID"
